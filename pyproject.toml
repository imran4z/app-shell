[project]
name = "appshell"
version = "0.1.0"
description = "App Shell - clone-and-build application template"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "click>=8.1",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "sqlalchemy>=2.0",
    "sse-starlette>=2.1",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
appshell = "appshell.cli.main:cli"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appshell"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PT", "RET", "SIM", "TCH"]
ignore = [
    "E402",   # main.py imports routers after app creation by design
    "UP042",  # blueprint mandates `class X(str, Enum)` - the value IS the contract
    "B039",   # ContextVar defaults read env at import by design (llm_client)
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates annotations at runtime - don't move their imports
# into TYPE_CHECKING blocks.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: needs Docker (testcontainers Postgres); run via `just test-integration`",
]

[tool.mypy]
strict = true
packages = ["appshell"]
mypy_path = "src"
ignore_missing_imports = true
